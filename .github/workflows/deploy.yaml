name: html application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: set up docker
        script: |
          docker compose up -d --build

      - name: run tests
        script: |
          curl http://localhost:8080/
